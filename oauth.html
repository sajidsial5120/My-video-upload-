<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization Complete - My Video Upload</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 24px; color: #161823; }
  .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 14px; color: #555; line-height: 1.6; }
  .code { background: #f4f4f5; border: 1px dashed #999; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; word-break: break-all; margin: 16px 0; }
  .ok { color: #0a7c42; font-weight: bold; }
  .err { color: #c00; font-weight: bold; }
  button { background: #fe2c55; color: #fff; border: 0; border-radius: 8px; padding: 12px 24px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>My Video Upload — TikTok Authorization</h1>
  <div id="out"><p>Reading authorization result…</p></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var out = document.getElementById('out');
  var code = q.get('code');
  var err = q.get('error');
  if (code) {
    out.innerHTML = '<p class="ok">✔ Authorization successful.</p>' +
      '<p>Copy this authorization code and paste it into your uploader tool:</p>' +
      '<div class="code" id="code">' + code.replace(/</g, '&lt;') + '</div>' +
      '<button onclick="navigator.clipboard.writeText(document.getElementById(\'code\').textContent).then(function(){alert(\'Copied!\')})">Copy code</button>';
  } else if (err) {
    out.innerHTML = '<p class="err">✘ Authorization failed: ' + err.replace(/</g, '&lt;') + '</p>' +
      '<p>' + (q.get('error_description') || '').replace(/</g, '&lt;') + '</p>';
  } else {
    out.innerHTML = '<p>No authorization code found in the URL. If you just authorized the app, please try the login step again.</p>';
  }
})();
</script>
</body>
</html>
